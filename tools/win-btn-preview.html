<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root{
    --ink:#0A0A0B; --line:#222226; --gold:#C9A227; --gold-l:#E8C766; --dim:#8A8A8E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:#EDEDED;
    font-family:"Microsoft YaHei",system-ui,sans-serif;padding:22px 24px 30px;}
  h1{font-size:13px;letter-spacing:4px;color:var(--gold);font-weight:400;margin:0 0 4px;}
  .sub{font-size:11px;color:#5a5a5e;letter-spacing:1px;margin-bottom:22px;}

  .row{display:flex;align-items:center;gap:18px;margin-bottom:14px;}
  .tag{width:150px;flex:none;font-size:11px;letter-spacing:1.5px;color:#8a8a90;text-align:right;padding-right:6px;}
  .tag b{display:block;color:#cfcfd4;font-weight:400;font-size:12px;letter-spacing:2px;margin-bottom:2px;}

  /* 模拟顶栏右侧一块 */
  .bar{display:flex;align-items:stretch;height:64px;border:1px solid var(--line);
    background:var(--ink);border-left:1px solid #2c2c32;}
  .wc{width:54px;height:100%;display:flex;align-items:center;justify-content:center;
    background:none;border:0;cursor:pointer;color:#8f8f96;transition:background .14s,color .14s;padding:0;}
  .wc:hover{background:rgba(201,162,39,.12);color:var(--gold-l);}
  .wc.cl:hover{background:#c42b1c;color:#fff;}
  .wc svg{display:block;}

  /* ── A 细线（当前） ── */
  .A svg{width:13px;height:13px;}
  .A svg path,.A svg rect{stroke-width:1.25;}

  /* ── B 细线加大 ── */
  .B .wc{width:60px;}
  .B svg{width:17px;height:17px;}
  .B svg path,.B svg rect{stroke-width:1.2;}

  /* ── C 描边加粗 ── */
  .C svg{width:13px;height:13px;}
  .C svg path,.C svg rect{stroke-width:1.9;}

  /* ── D 实心几何 ── */
  .D svg{width:13px;height:13px;}

  /* ── E 圆角风格 ── */
  .E svg{width:14px;height:14px;}
  .E .wc{border-radius:0;}

  .note{font-size:10.5px;color:#4e4e54;letter-spacing:.6px;flex:1;line-height:1.5;}
</style>
</head>
<body>
  <h1>窗口按钮 · 五种方案</h1>
  <div class="sub">真实尺寸 54×64 · 真实配色 · 鼠标移上去可看 hover</div>

  <!-- A -->
  <div class="row">
    <div class="tag"><b>A · 细线</b>当前</div>
    <div class="bar A">
      <button class="wc"><svg viewBox="0 0 10 10"><path d="M2 5h6" stroke="currentColor" stroke-width="1.25"/></svg></button>
      <button class="wc"><svg viewBox="0 0 10 10"><rect x="2.2" y="2.2" width="5.6" height="5.6" fill="none" stroke="currentColor" stroke-width="1.25"/></svg></button>
      <button class="wc cl"><svg viewBox="0 0 10 10"><path d="M2.4 2.4l5.2 5.2M7.6 2.4l-5.2 5.2" stroke="currentColor" stroke-width="1.25"/></svg></button>
    </div>
    <div class="note">轻、安静，但 13px 下确实偏细弱</div>
  </div>

  <!-- B -->
  <div class="row">
    <div class="tag"><b>B · 整体放大</b>60px / 17px</div>
    <div class="bar B">
      <button class="wc"><svg viewBox="0 0 10 10"><path d="M2 5h6" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="wc"><svg viewBox="0 0 10 10"><rect x="2.2" y="2.2" width="5.6" height="5.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="wc cl"><svg viewBox="0 0 10 10"><path d="M2.4 2.4l5.2 5.2M7.6 2.4l-5.2 5.2" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
    <div class="note">保持细线气质，只把体量提上来</div>
  </div>

  <!-- C -->
  <div class="row">
    <div class="tag"><b>C · 描边加粗</b>13px / 1.9</div>
    <div class="bar C">
      <button class="wc"><svg viewBox="0 0 10 10"><path d="M2 5h6" stroke="currentColor" stroke-width="1.9"/></svg></button>
      <button class="wc"><svg viewBox="0 0 10 10"><rect x="2.2" y="2.2" width="5.6" height="5.6" fill="none" stroke="currentColor" stroke-width="1.9"/></svg></button>
      <button class="wc cl"><svg viewBox="0 0 10 10"><path d="M2.4 2.4l5.2 5.2M7.6 2.4l-5.2 5.2" stroke="currentColor" stroke-width="1.9"/></svg></button>
    </div>
    <div class="note">不占更多空间，靠笔画重量撑起来</div>
  </div>

  <!-- D -->
  <div class="row">
    <div class="tag"><b>D · 实心几何</b>块状</div>
    <div class="bar D">
      <button class="wc"><svg viewBox="0 0 10 10"><rect x="2" y="4.4" width="6" height="1.2" fill="currentColor"/></svg></button>
      <button class="wc"><svg viewBox="0 0 10 10"><rect x="2.3" y="2.3" width="5.4" height="5.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="wc cl"><svg viewBox="0 0 10 10"><path d="M2.6 2.6l4.8 4.8M7.4 2.6l-4.8 4.8" stroke="currentColor" stroke-width="1.6"/></svg></button>
    </div>
    <div class="note">最小化改成实心块，重量感最强，接近 macOS 直角派</div>
  </div>

  <!-- E -->
  <div class="row">
    <div class="tag"><b>E · 圆角化</b>软一点</div>
    <div class="bar E">
      <button class="wc"><svg viewBox="0 0 10 10"><rect x="2" y="4.5" width="6" height="1.1" rx=".55" fill="currentColor"/></svg></button>
      <button class="wc"><svg viewBox="0 0 10 10"><rect x="2.3" y="2.3" width="5.4" height="5.4" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="wc cl"><svg viewBox="0 0 10 10"><path d="M2.8 2.8l4.4 4.4M7.2 2.8l-4.4 4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    </div>
    <div class="note">线端圆头、方框圆角，质感更软，和唱片机那套更配</div>
  </div>

  <div class="sub" style="margin:22px 0 0">悬停效果五个方案相同：淡金底 / 关闭键红底</div>
</body>
</html>
