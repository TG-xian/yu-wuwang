name: 打包

on:
  workflow_dispatch:          # 手动触发
  push:
    tags: ['v*']              # 打 tag 时自动出包

jobs:
  # ── Windows ──
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包（NSIS 安装包）
        run: npm run dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: YuWuwang-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

  # ── macOS ──
  # 只能在 mac 上跑：electron-builder 在 Windows/Linux 上拒绝构建 mac 目标
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包（dmg，arm64 + x64）
        run: npm run dist:mac
        env:
          # 没有 Apple Developer 证书，跳过签名。
          # 产物未签名：用户首次打开需要右键「打开」或执行 xattr -cr
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: YuWuwang-macOS
          path: dist/*.dmg
          if-no-files-found: error

  # ── 汇总 ──
  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
