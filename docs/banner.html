<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 900px; height: 300px; background: #0a0a0c;
    display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", sans-serif; overflow: hidden;
  }
  /* 与 app.css 的 .brand 完全同构，只是等比放大 4 倍 */
  .brand { display: flex; align-items: center; gap: 48px; }
  .brand .mark { width: 128px; height: 128px; flex: none; }
  .brand .mark svg { width: 100%; height: 100%; display: block; }
  .brand .nm {
    font-family: "Songti SC", "SimSun", Georgia, serif;
    font-size: 84px; font-weight: 700; color: #fff;
    letter-spacing: 12px; line-height: 1.05; text-indent: 12px;
  }
  .brand .sub {
    font-family: Consolas, monospace; font-size: 30px;
    letter-spacing: 10.4px; color: #A8853A; margin-top: 12px; line-height: 1;
    text-indent: 10.4px;
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 96 96"><rect x="7.5" y="7.5" width="81" height="81" fill="none" stroke="#C9A227" stroke-width="3"/><rect x="20" y="12.2" width="56" height="4.4" rx="0.9" fill="#C9A227"/><rect x="20" y="20.6" width="56" height="4.4" rx="0.9" fill="#C9A227"/><rect x="20" y="29" width="56" height="4.4" rx="0.9" fill="#C9A227"/><rect x="20" y="37.400000000000006" width="23" height="4.4" rx="0.9" fill="#E8C766"/><rect x="53" y="37.400000000000006" width="23" height="4.4" rx="0.9" fill="#E8C766"/><rect x="20" y="45.8" width="23" height="4.4" rx="0.9" fill="#E8C766"/><rect x="53" y="45.8" width="23" height="4.4" rx="0.9" fill="#E8C766"/><rect x="20" y="54.2" width="56" height="4.4" rx="0.9" fill="#E8C766"/><rect x="20" y="62.60000000000001" width="23" height="4.4" rx="0.9" fill="#8A6D1F"/><rect x="53" y="62.60000000000001" width="23" height="4.4" rx="0.9" fill="#8A6D1F"/><rect x="20" y="71" width="23" height="4.4" rx="0.9" fill="#8A6D1F"/><rect x="53" y="71" width="23" height="4.4" rx="0.9" fill="#8A6D1F"/><rect x="20" y="79.4" width="23" height="4.4" rx="0.9" fill="#8A6D1F"/><rect x="53" y="79.4" width="23" height="4.4" rx="0.9" fill="#8A6D1F"/></svg></div>
    <div>
      <div class="nm">豫</div>
      <div class="sub">WÚ WÀNG</div>
    </div>
  </div>
</body>
</html>
