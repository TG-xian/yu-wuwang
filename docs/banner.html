<!DOCTYPE html>

  .rule { width: 360px; height: 1px; background: linear-gradient(90deg, #C9A227 0%, rgba(201,162,39,.12) 100%); margin: 18px 0 15px; }
  p { font-size: 17px; color: #9a9a9a; letter-spacing: 3px; font-weight: 300; }
  .en { font-size: 11.5px; color: #6e5b23; letter-spacing: 7px; margin-top: 12px; font-family: Consolas, monospace; }
</style>
</head>
